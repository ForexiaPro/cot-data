[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "forexia-cot"
version = "1.0.0"
description = "CFTC Commitments of Traders (COT) data for FX futures and gold, legacy and TFF reports: positions, net and net as a share of open interest. Weekly, since 2010."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Forexia" }]
keywords = ["cot", "cot report", "commitments of traders", "cftc", "forex", "positioning", "futures", "gold"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Office/Business :: Financial",
  "Topic :: Office/Business :: Financial :: Investment",
  "Intended Audience :: Financial and Insurance Industry",
  "Intended Audience :: Science/Research",
]
dependencies = []

[project.optional-dependencies]
pandas = ["pandas"]

[project.scripts]
forexia-cot = "forexia_cot.__main__:main"

[project.urls]
Homepage = "https://github.com/ForexiaPro/cot-data"
Source = "https://github.com/ForexiaPro/cot-data/tree/main/python"
"COT report" = "https://forexiapro.com/cot-report/?via=cot-data"
